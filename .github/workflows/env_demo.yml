#Goal: to learn secret and print env name variable

name: Show Env variables

on: 
 workflow_dispatch: 

env:
  NAME: Gunjan
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "My name is ${{env.NAME}}"
      - name: Show Secret
        run: echo "My fun secret is ${{secret.BHUMI_SECRET}}"
      - name: Show env variables
        run: echo "MY dockerhub name is ${{vars.GAR_DOCKERHUB}}"
